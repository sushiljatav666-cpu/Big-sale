<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sushil Shop</title><link rel="stylesheet" href="/style.css"></head><body>
<header><b>🛍️ Sushil Shop</b><nav><a href="#shop">Shop</a><button onclick="openCart()">🛒 Cart <span id="count">0</span></button><a href="#admin">Admin</a></nav></header>
<main id="shop"><section class="hero"><h1>Simple. Fast. Secure Shopping.</h1><p>Browse products, add to cart and place your order.</p></section><div id="products" class="grid"></div></main>
<section id="admin" class="admin"><h2>🔐 Admin</h2><div id="login"><input id="ae" placeholder="Admin email"><input id="ap" type="password" placeholder="Password"><button onclick="login()">Login</button></div><div id="panel" hidden><h3>Products</h3><button type="button" onclick="logout()">Logout</button><form id="productForm" onsubmit="saveProduct(event)"><input id="pid" type="hidden"><input id="pn" placeholder="Product name" required><input id="pp" type="number" placeholder="Price" required><input id="pd" type="number" placeholder="Discount %" value="0"><input id="ps" type="number" placeholder="Stock" value="0"><input id="pi" placeholder="Image URL"><textarea id="px" placeholder="Description"></textarea><button>Save product</button><button type="button" onclick="resetForm()">New</button></form><div id="adminProducts"></div><h3>Orders</h3><div id="orders"></div></div></section>
<div id="cart" class="drawer"><div class="drawerHead"><h2>Cart</h2><button onclick="closeCart()">✕</button></div><div id="cartItems"></div><h3>Total: ₹<span id="total">0</span></h3><form id="checkout" onsubmit="placeOrder(event)"><input id="cn" placeholder="Name" required><input id="ce" type="email" placeholder="Email" required><input id="cp" placeholder="Phone"><textarea id="ca" placeholder="Full address" required></textarea><button>Place Order</button></form></div>
<script src="/app.js"></script></body></html>
